name: Daily refresh — Duval FL distress intelligence

# What this does (in order):
#   1. Pull each Duval primary event source for a wide live window:
#        - or.duvalclerk.com clerk recordings  (stdlib HTTP)
#        - jaxdailyrecord.com Ch. 45 notices    (stdlib HTTP)
#        - duval.realforeclose.com auctions     (Playwright stealth Chromium)
#        - duval.realtaxdeed.com auctions       (Playwright stealth Chromium)
#   2. Run the v5.4.0 staged pipeline + pre-pipeline matcher (ArcGIS REST).
#   3. Build the operator-board dashboard payload (with NEW + last-30d tagging).
#   4. Commit the refreshed data/leads.json + dashboard/ + raw event files
#      back to main so GitHub Pages serves the new payload immediately.
#
# Playwright headed-only stealth note (SurplusIQ pattern):
#   duval.realforeclose.com and duval.realtaxdeed.com sit behind a RealAuction
#   anti-bot WAF. The committed adapter (scrapers/realauction_duval.py) runs
#   stealthy Chromium with AutomationControlled disabled. On Linux runners the
#   browser starts in headed mode under xvfb-run (Chromium headless gives away
#   the bot — same fingerprint behavior SurplusIQ documented). On macOS the
#   adapter is headed by default; on the Linux GHA runner we wrap with xvfb.

on:
  schedule:
    # 07:30 UTC = 03:30 ET (after the Clerk's overnight indexing settles).
    - cron: "30 7 * * *"
  workflow_dispatch:                # manual operator trigger

permissions:
  contents: write                   # the job pushes data + dashboard back

concurrency:
  group: duval-fl-daily-refresh
  cancel-in-progress: false         # don't kill a running refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We commit back; keep the credential helper that actions/checkout
          # configures (default) so the final git push works.
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Playwright drives the two RealAuction portals. Stdlib covers
          # clerk + jaxdailyrecord + the ArcGIS REST matcher.
          python -m pip install playwright==1.45.0

      - name: Install Playwright Chromium + system deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Install xvfb (headed Chromium under virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # --------------------------------------------------------------
      # 1. Pull primary event sources
      # --------------------------------------------------------------
      - name: Pull clerk_official_records (last 30 days)
        run: |
          python scrapers/clerk_official_records.py --days-back 30

      - name: Pull jaxdailyrecord foreclosure notices
        run: |
          python scrapers/jaxdailyrecord_foreclosures.py || true
          # Non-fatal — the daily-record HTML occasionally returns an empty
          # listing on weekends. The pipeline will skip a missing file.

      - name: Pull RealAuction foreclosure calendar (Playwright + xvfb)
        run: |
          xvfb-run -a python scrapers/realauction_duval.py \
            --portal realforeclose --days-back 14 --days-forward 90 --headed

      - name: Pull RealAuction tax-deed calendar (Playwright + xvfb)
        run: |
          xvfb-run -a python scrapers/realauction_duval.py \
            --portal realtaxdeed --days-back 30 --days-forward 180 --headed

      - name: Pull Duval PA tax roll (monthly uncertified pipe-delimited)
        # The PA tax roll's filename changes monthly; the data-offerings page
        # is the discovery surface. For CI we hardcode the current month;
        # operators rotate this URL each month (or build a discovery step).
        env:
          PA_TXT_ZIP_URL: ${{ vars.PA_TXT_ZIP_URL || 'https://www.jacksonville.gov/getContentAsset/d9765ea7-5c22-4211-8b70-ff8393eec112/135b97c9-84fa-4e82-b956-0fbccec4aa1f/DCPAO-REAL-ESTATE-PIPE-DELIMITED-TEXT-UNCERTIFIED-AS-OF-04-07-2026.zip' }}
        run: |
          rm -f data/raw/pa_tax_roll_src.zip      # force re-download each run
          python scrapers/pa_tax_roll.py --url "$PA_TXT_ZIP_URL"

      - name: Parse Duval Tax Collector delinquency export
        # PUNCH-LIST — the county-taxes.net real-estate report download is
        # NOT yet automated in CI (the page is JS-rendered behind
        # Cloudflare; reverse-engineering the export endpoint is a separate
        # build). The expected file is data/raw/duval_tax_collector_src.csv,
        # committed manually by the operator after each refresh OR uploaded
        # via gh release / repo artifact; the parser is idempotent and
        # safely no-ops if the file is missing.
        run: |
          if [ -f data/raw/duval_tax_collector_src.csv ]; then
            python scrapers/duval_tax_collector.py
          else
            echo "::warning::data/raw/duval_tax_collector_src.csv missing — \
              tax_collector source will be stale until operator uploads. \
              Skipping parser (existing JSONL outputs remain unchanged)."
          fi

      # --------------------------------------------------------------
      # 2. Staged pipeline (§17 → §18 → §19 → §20 → seam → scoring)
      # --------------------------------------------------------------
      - name: Run county pipeline
        run: |
          python runs/duval_fl/_run_county_pipeline.py

      # --------------------------------------------------------------
      # 3. Dashboard payload (El Paso renderer record shape)
      # --------------------------------------------------------------
      - name: Build dashboard payload
        run: |
          python runs/duval_fl/_build_el_paso_data.py

      # --------------------------------------------------------------
      # 4. Commit + push (Pages publishes on main).
      # --------------------------------------------------------------
      - name: Commit refreshed data
        run: |
          git config user.name  "duval-fl-refresh[bot]"
          git config user.email "duval-fl-refresh@users.noreply.github.com"
          # data/raw/ is gitignored — only the dashboard payload, the
          # operator board JSON, and the staged build receipts are committed.
          git add data/leads.json \
                  dashboard/data.json \
                  dashboard/data.js \
                  runs/duval_fl/build/staged/matched_leads.json \
                  runs/duval_fl/build/staged/scored_leads.json \
                  runs/duval_fl/build/staged/evidence_ledger.json \
                  runs/duval_fl/build/staged/punch_list.json || true
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git commit -m "duval-fl daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${GITHUB_REF_NAME}
