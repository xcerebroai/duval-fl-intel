name: Daily refresh — Duval FL distress intelligence

# What this does (in order):
#   1. Pull each Duval primary event source for a wide live window:
#        - or.duvalclerk.com clerk recordings  (stdlib HTTP)
#        - jaxdailyrecord.com Ch. 45 notices    (stdlib HTTP)
#        - duval.realforeclose.com auctions     (Playwright stealth Chromium)
#        - duval.realtaxdeed.com auctions       (Playwright stealth Chromium)
#   2. Run the v5.4.0 staged pipeline + pre-pipeline matcher (ArcGIS REST).
#   3. Build the operator-board dashboard payload (with NEW + last-30d tagging).
#   4. Commit the refreshed data/leads.json + dashboard/ + raw event files
#      back to main so GitHub Pages serves the new payload immediately.
#
# Playwright headed-only stealth note (SurplusIQ pattern):
#   duval.realforeclose.com and duval.realtaxdeed.com sit behind a RealAuction
#   anti-bot WAF. The committed adapter (scrapers/realauction_duval.py) runs
#   stealthy Chromium with AutomationControlled disabled. On Linux runners the
#   browser starts in headed mode under xvfb-run (Chromium headless gives away
#   the bot — same fingerprint behavior SurplusIQ documented). On macOS the
#   adapter is headed by default; on the Linux GHA runner we wrap with xvfb.

on:
  schedule:
    # 07:30 UTC = 03:30 ET (after the Clerk's overnight indexing settles).
    - cron: "30 7 * * *"
  workflow_dispatch:                # manual operator trigger

permissions:
  contents: write                   # the job pushes data + dashboard back

concurrency:
  group: duval-fl-daily-refresh
  cancel-in-progress: false         # don't kill a running refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We commit back; keep the credential helper that actions/checkout
          # configures (default) so the final git push works.
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Playwright drives the two RealAuction portals. Stdlib covers
          # clerk + jaxdailyrecord + the ArcGIS REST matcher.
          python -m pip install playwright==1.45.0

      - name: Install Playwright Chromium + system deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Install xvfb (headed Chromium under virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # --------------------------------------------------------------
      # 1. Pull primary event sources
      # --------------------------------------------------------------
      - name: Pull clerk_official_records (last 30 days)
        # v5.5.0 §6.7 source resilience: or.duvalclerk.com (Acclaim) is a slow
        # county portal — a single `URLError: timed out` used to kill the whole
        # refresh. The scraper now retries each request 3× with an increasing
        # timeout (120s → 240s → 360s) and exponential backoff. If the portal
        # is genuinely down it still ultimately fails — so this step is
        # continue-on-error: a clerk outage drops clerk leads only, the rest of
        # the refresh proceeds, and the §6.4-style sanity gate below decides
        # whether the remaining board is healthy enough to publish.
        continue-on-error: true
        run: |
          python scrapers/clerk_official_records.py --days-back 30 \
            --retries 3 --timeout 120

      - name: Pull jaxdailyrecord foreclosure notices
        run: |
          python scrapers/jaxdailyrecord_foreclosures.py || true
          # Non-fatal — the daily-record HTML occasionally returns an empty
          # listing on weekends. The pipeline will skip a missing file.

      - name: Pull RealAuction foreclosure calendar (Playwright + xvfb)
        # Fragile by nature — stealth Chromium behind a RealAuction anti-bot
        # WAF. One bad day on this portal must not sink the whole refresh, so
        # continue-on-error and let the sanity gate judge the remaining board.
        continue-on-error: true
        run: |
          xvfb-run -a python scrapers/realauction_duval.py \
            --portal realforeclose --days-back 14 --days-forward 90 --headed

      - name: Pull RealAuction tax-deed calendar (Playwright + xvfb)
        continue-on-error: true
        run: |
          xvfb-run -a python scrapers/realauction_duval.py \
            --portal realtaxdeed --days-back 30 --days-forward 180 --headed

      - name: Pull Duval PA tax roll (monthly uncertified pipe-delimited)
        # The PA tax roll's filename changes monthly; the data-offerings page
        # is the discovery surface. For CI we hardcode the current month;
        # operators rotate this URL each month (or build a discovery step).
        env:
          PA_TXT_ZIP_URL: ${{ vars.PA_TXT_ZIP_URL || 'https://www.jacksonville.gov/getContentAsset/d9765ea7-5c22-4211-8b70-ff8393eec112/135b97c9-84fa-4e82-b956-0fbccec4aa1f/DCPAO-REAL-ESTATE-PIPE-DELIMITED-TEXT-UNCERTIFIED-AS-OF-04-07-2026.zip' }}
        run: |
          rm -f data/raw/pa_tax_roll_src.zip      # force re-download each run
          python scrapers/pa_tax_roll.py --url "$PA_TXT_ZIP_URL"

      - name: Parse Duval Tax Collector delinquency export
        # The county-taxes.net real-estate report download is NOT yet
        # automated in CI (the page is JS-rendered behind Cloudflare; the
        # export endpoint isn't reverse-engineered). The operator commits
        # a gzipped copy at data/raw/duval_tax_collector_src.csv.gz
        # (gitignore exception). Daily-refresh gunzips it before parsing.
        # If the .gz is missing the run FAILS LOUDLY — never silently
        # publish a board that dropped the 19,878 tax-default leads.
        run: |
          if [ ! -f data/raw/duval_tax_collector_src.csv.gz ]; then
            echo "::error::data/raw/duval_tax_collector_src.csv.gz is missing — \
              operator must re-download the county-taxes.net real-estate \
              report and commit it gzipped. Refusing to publish a degraded \
              board without the tax-default leads."
            exit 1
          fi
          gunzip -k -f data/raw/duval_tax_collector_src.csv.gz
          python scrapers/duval_tax_collector.py

      # --------------------------------------------------------------
      # 2. Staged pipeline (§17 → §18 → §19 → §20 → seam → scoring)
      # --------------------------------------------------------------
      - name: Run county pipeline
        run: |
          python runs/duval_fl/_run_county_pipeline.py

      # --------------------------------------------------------------
      # 3. Dashboard payload (operator-board record shape)
      # --------------------------------------------------------------
      - name: Build dashboard payload
        run: |
          python runs/duval_fl/_build_el_paso_data.py

      # --------------------------------------------------------------
      # 3a. SANITY THRESHOLDS — refuse to publish a degraded board.
      # The Greene-NY lesson: CI silently shipped 525 of 1,210 leads
      # because a source dropped without warning. We fail the run if the
      # rebuilt payload regresses against known-good baselines.
      # --------------------------------------------------------------
      - name: Verify lead-count + ENRICHMENT sanity thresholds
        id: gate
        # v5.5.0 §6.4 publish gate. continue-on-error so a gate FAIL does not
        # abort the job at this step — instead we capture steps.gate.outcome
        # and branch: PASS → publish (commit/push); FAIL → preserve last-good
        # and fail the run loudly. This is what makes one dead source survivable
        # (continue-on-error on the pull) WITHOUT ever publishing a dead board
        # (the gate still has the final say on publishability).
        continue-on-error: true
        # Standing rule against the Greene-NY failure mode: CI re-pulled
        # the primary event sources but did NOT re-run the parcel
        # enrichment, so every lead came out "Unknown — no owner — no
        # address". A numerically-correct lead_total is NOT enough; we
        # also assert that the enrichment join produced the expected
        # surface — resolved owners, resolved addresses, tax-default
        # depth. If ANY threshold drops below the known-good floor, the
        # workflow FAILS and the broken board is never published.
        env:
          DUVAL_MIN_LEAD_TOTAL: "25000"          # known-good 26,754 -5% margin
          DUVAL_MIN_TAX_DEFAULT: "18000"         # known-good 19,878
          DUVAL_MIN_ADDR_RESOLVED: "20000"       # known-good 22,873
          DUVAL_MIN_OWNER_EVENT_DOC: "20000"     # known-good 22,878  (§17 +
                                                  # TC + PA-estate owner)
          DUVAL_MAX_OWNER_UNRESOLVED: "5000"     # known-good 3,639 (cap to
                                                  # catch a dead-board run)
        run: |
          python - <<'PY'
          import json, os, sys
          p = json.load(open("dashboard/data.json"))
          osd = p.get("owner_source_distribution", {})
          total = p.get("lead_total", 0)
          tax_default = p.get("tax_default_leads", 0)
          addr = p.get("address_resolved_leads", 0)
          owner_doc = osd.get("event_document", 0)
          owner_un = osd.get("unresolved", 0)
          checks = [
              ("lead_total",             total,      ">=",
               int(os.environ["DUVAL_MIN_LEAD_TOTAL"])),
              ("tax_default_leads",      tax_default, ">=",
               int(os.environ["DUVAL_MIN_TAX_DEFAULT"])),
              ("address_resolved_leads", addr,        ">=",
               int(os.environ["DUVAL_MIN_ADDR_RESOLVED"])),
              ("owner.event_document",   owner_doc,   ">=",
               int(os.environ["DUVAL_MIN_OWNER_EVENT_DOC"])),
              ("owner.unresolved",       owner_un,    "<=",
               int(os.environ["DUVAL_MAX_OWNER_UNRESOLVED"])),
          ]
          failed = []
          for name, got, op, thr in checks:
              ok = (got >= thr) if op == ">=" else (got <= thr)
              status = "OK" if ok else "FAIL"
              print(f"  {name:<26} got={got:>6,}  {op}  {thr:>6,}  [{status}]")
              if not ok:
                  failed.append(f"{name} {got} {op} {thr}")
          if failed:
              print()
              print("::error::sanity threshold(s) failed: "
                    + "; ".join(failed))
              print("::error::refusing to publish a degraded board — "
                    "the most common cause is that the parcel-enrichment "
                    "join (PA tax roll → owner / address) did not run "
                    "this cycle. Investigate the upstream source(s).")
              sys.exit(1)
          print("\nAll sanity thresholds passed.")
          PY

      # --------------------------------------------------------------
      # 4. Commit + push (Pages publishes on main) — ONLY if the publish
      #    gate passed. v5.5.0 §6.5 publish-or-preserve-last-good.
      # --------------------------------------------------------------
      - name: Commit refreshed data
        if: steps.gate.outcome == 'success'
        run: |
          git config user.name  "duval-fl-refresh[bot]"
          git config user.email "duval-fl-refresh@users.noreply.github.com"
          # data/raw/ is gitignored — only the dashboard payload, the
          # operator board JSON, and the staged build receipts are committed.
          git add data/leads.json \
                  dashboard/data.json \
                  dashboard/data.js \
                  runs/duval_fl/build/staged/matched_leads.json \
                  runs/duval_fl/build/staged/scored_leads.json \
                  runs/duval_fl/build/staged/evidence_ledger.json \
                  runs/duval_fl/build/staged/punch_list.json || true
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git commit -m "duval-fl daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${GITHUB_REF_NAME}

      # --------------------------------------------------------------
      # 4b. Publish gate FAILED — preserve last-good + fail loud.
      #     We never committed/pushed, so the previous data/leads.json +
      #     dashboard/ on main stay live on GitHub Pages untouched. We only
      #     write a failure receipt and exit non-zero so the operator is
      #     alerted (red run) rather than silently shipping a degraded board.
      # --------------------------------------------------------------
      - name: Preserve last-good + fail loud (publish gate FAIL)
        if: steps.gate.outcome != 'success'
        run: |
          mkdir -p runs/duval_fl
          {
            echo "Daily refresh DID NOT PUBLISH at $(date -u +%Y-%m-%dT%H:%MZ)."
            echo "The §6.4 sanity/enrichment gate failed — see the gate step log"
            echo "for which threshold(s) regressed. The previously published"
            echo "Duval board (last-good data/leads.json + dashboard/ on main)"
            echo "remains live on GitHub Pages; nothing was overwritten."
          } | tee runs/duval_fl/last_failed_refresh.txt
          echo "::error::Duval daily refresh withheld — publish gate failed; last-good board preserved."
          exit 1
